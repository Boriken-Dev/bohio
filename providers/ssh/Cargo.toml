[package]
name = "bohio-provider-ssh"
description = "A Bohío provider for a machine reached over SSH: its terminal, its processes and, over SFTP, its files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["bohio", "ssh", "sftp", "provider"]
categories = ["network-programming"]
exclude = [".*", "*.local.*"]
# Its git dependencies are unpublished: released once they are.
publish = false

[dependencies]
bohio-api.workspace = true
russh.workspace = true
russh-sftp.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
bohio-api = { workspace = true, features = ["testing"] }
tempfile.workspace = true
rand = { version = "0.10", default-features = false, features = ["std", "std_rng", "thread_rng"] }
tokio = { workspace = true, features = ["process"] }

[lints]
workspace = true
