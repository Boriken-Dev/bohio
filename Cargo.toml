[workspace]
resolver = "3"
members = ["crates/bohio-proto", "crates/bohio-transfer", "crates/bohio-client", "crates/bohio", "crates/bohio-bench"]

[workspace.package]
version = "0.0.0-alpha.0"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/bohio"

[workspace.dependencies]
# The wire types, derived for CBOR (and JSON in the vectors and the command's `--format json`).
serde = { version = "1", default-features = false, features = ["derive", "std"] }
# Control messages: CBOR maps with string keys, so a client in any language reads them and ignores keys it does not know.
ciborium = { version = "0.2", default-features = false }
serde_json = "1"
# bohio.cfg: the codec of the layers (anycfg) and the in-place edit of a peer table (toml_edit keeps comments and layout).
toml = { version = "1", default-features = false, features = ["parse", "display", "serde", "std"] }
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
anycfg = { git = "https://github.com/jose-pr/anycfg-rs", rev = "bf71f7097a550037972a0651e8bd35747b8dcd11" }
# Error types.
thiserror = "2"
# The command line.
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "env"] }
# Diagnostics; the subscriber is the binary's.
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter", "ansi"] }
# The channel contract every operation is served over, and the in-process transport the tests use. Alpha, by revision, as the family pins it.
coqui-transport = { git = "https://github.com/Boriken-Dev/coqui-transport", rev = "2601da58de9cac8f635060e4746864e9b238c6c5", default-features = false, features = ["process"] }
# The proven link, its streams and pairing, by the revision it was published at.
coqui-link = { git = "https://github.com/Boriken-Dev/coqui-link", rev = "46efc71ee72d73d3f1faafbcff2cddc08cea360e", features = ["sealed", "forward"] }
# The trust store and peer ids, at the revision coqui-link names so one copy builds.
coqui-peer = { git = "https://github.com/Boriken-Dev/coqui-peer", rev = "984db3d54b73de10c7892b06fe269a259de2d1c5" }
# The transports a link runs over besides TCP, each at the revision that names the same coqui-transport.
coqui-transport-pipe = { git = "https://github.com/Boriken-Dev/coqui-transport-pipe", rev = "76d97671d87372be5d29263a98198a08fea5eaed", features = ["channel"] }
coqui-transport-web = { git = "https://github.com/Boriken-Dev/coqui-transport-web", rev = "c24a35d19df3867e222cb458bce2ad782d98c1eb", features = ["websocket", "webtransport"] }
# TLS configurations for wss and WebTransport: the server identity (read from files or generated) and the client trust (roots, pins). The same coqui-peer and coqui-builder revisions as the rest.
coqui-peer-tls = { git = "https://github.com/Boriken-Dev/coqui-peer-tls", rev = "7cbd7ee208595c055d74eed79a4dafcd0175883d", features = ["generate", "platform-roots"] }
# The rustls configuration types the TLS endpoints hand to the web transports; ring, as they build it.
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
# Reads a certificate's validity and key type to say whether a browser accepts its hash as a pin.
x509-parser = { version = "0.18", default-features = false }
# Tests: certificates generated at test time.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
# Tests: a certificate whose validity starts later.
time = { version = "0.3", default-features = false, features = ["std"] }
coqui-transport-serial = { git = "https://github.com/Boriken-Dev/coqui-transport-serial", rev = "98b295f5580b9acbaefe43c1d0e3c83aff62afe1" }
# TCP socket buffer sizes, set before connecting and on a listener.
socket2 = "0.6"
# A WebSocket endpoint is a URL.
url = "2.5"
# The Windows service manager: `bohio service`. Its entry point is written without the crate's macro, which expands to unsafe code.
windows-service = "0.8"
# Signalling a process group and looking at a child without collecting it, which std does not offer; a pipe with close-on-exec set.
rustix = { version = "1", default-features = false, features = ["std", "process", "pipe", "fs"] }
# The system calls a guardian process makes between `fork` and `exec` (`platform/guard.rs`), which rustix does not offer.
libc = "0.2"
# A job object that ends every process in it when its handle closes.
win32job = "2.0.3"
windows-sys = { version = "0.61", default-features = false, features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Threading"] }
# The desktop backend (`platform/gui`): DXGI Desktop Duplication and GDI capture, `SendInput`, the session and input-desktop queries and the clipboard. Its COM bindings and `Result` returns are what windows-sys lacks; win32job already brings this crate, so the lock gains no package.
windows = { version = "0.62", default-features = false, features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_RemoteDesktop", "Win32_System_StationsAndDesktops", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
# Ctrl-C of the local terminal as an event a command can answer, for `bohio remote exec` and `shell` (an interrupt to the program).
ctrlc = { version = "3.5", default-features = false }
# Raw mode and the size of the local terminal, for `bohio remote shell`.
crossterm = { version = "0.29", default-features = false, features = ["windows"] }
# Tests: arbitrary bytes for the codecs; the process list for the survivor checks.
proptest = { version = "1", default-features = false, features = ["std"] }
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
# A pseudo-terminal: openpty on Unix, ConPTY on Windows.
portable-pty = "0.9"
# Capability-style file access: every path resolves against a directory handle and cannot leave it.
cap-std = "4"
cap-fs-ext = "4"
# The digests `bohio-transfer` offers. RustCrypto's SHA-2, SHA-1 and MD5 (md-5) share one `digest` trait; SHA-1 and MD5 are there for
# comparing against tools and sums that still use them, not as a security choice.
sha2 = { version = "0.11", default-features = false }
sha1 = { version = "0.11", default-features = false }
md-5 = { version = "0.11", default-features = false }
# BLAKE3, the fast cryptographic digest (SIMD where the CPU has it).
blake3 = { version = "1", default-features = false, features = ["std"] }
# XXH3 (64 and 128 bits) and XXH64: fast non-cryptographic digests for change detection.
xxhash-rust = { version = "0.8", default-features = false, features = ["xxh3", "xxh64"] }
# CRC-32C (Castagnoli), hardware accelerated where the CPU has it.
crc32c = "0.6"
# Zstandard through the C library (levels to 22, long windows, worker threads with `zstdmt`): the compression a slow link wants. It compiles C
# through `cc`, as ring already does on every platform.
zstd = { version = "0.14", default-features = false }
# LZ4 blocks, for the hosts whose CPU cannot afford more. The frame around them is written and read by `bohio-transfer` itself, piece by piece.
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
# Deflate (zlib framing) on pure-Rust miniz_oxide: what a browser's `DecompressionStream` and Python's `zlib` decode.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Globs for the files a host never compresses.
globset = { version = "0.4", default-features = false }
# Unguessable names for prepared files.
getrandom = "0.4"
# Screen snapshots: resizing, and the PNG and JPEG encoders (and decoders, for the tests that check what was sent). No other format, no threads.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Lossless WebP for snapshots; the crate encodes lossless only.
image-webp = "0.2"
# The desktop notification that tells a person someone is viewing or controlling the screen (zbus on Linux, toasts on Windows, the system's on macOS).
notify-rust = { version = "4.19", default-features = false, features = ["z"] }
# Tests: scratch directories that remove themselves.
tempfile = "3"
bohio-proto = { path = "crates/bohio-proto" }
bohio-transfer = { path = "crates/bohio-transfer", default-features = false }
bohio-client = { path = "crates/bohio-client" }

# One PeerId type across the graph needs one source: the methods name coqui-peer by version.
[patch.crates-io]
coqui-peer = { git = "https://github.com/Boriken-Dev/coqui-peer", rev = "984db3d54b73de10c7892b06fe269a259de2d1c5" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

