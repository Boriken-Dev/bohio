name: Test

# On demand: workflow_dispatch (optionally at a ref), or a pushed "ci-*" tag or branch, deleted after its run.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test (branch, tag, or SHA)"
        required: false
        default: ""
  workflow_call:
    inputs:
      ref:
        description: "Git ref to test (branch, tag, or SHA)"
        type: string
        required: false
        default: ""
  push:
    tags:
      - "ci-*"
    branches:
      - "ci-*"

permissions:
  contents: read

# A newer run of the same ref replaces one still going.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        toolchain: [stable, "1.89"]
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install socat (the serial test's null-modem cable), Xvfb (the X11 desktop tests start one of their own) and the libraries of feature gui-wayland
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y socat xvfb libpipewire-0.3-dev libclang-dev pkg-config
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # The library alone: every feature off must build, as every feature on does.
      - run: cargo check --workspace --no-default-features
      # The exec and shell tests start this helper by its plain name, which a test run does not build.
      - run: cargo build -p bohio --example exec_helper --example gui_probe_x11
      - run: cargo test --workspace --all-features -- --nocapture
        env:
          # The desktop backends' live tests drive a window of their own (the X11 ones on an Xvfb they start); a
          # runner with no interactive desktop, or on macOS without the Screen Recording and Accessibility grants,
          # prints SKIPPED with the reason.
          BOHIO_TEST_GUI_LIVE: "1"
      - name: The vectors are current
        # The vectors test rewrites a file that differs; a clean tree means they were current.
        shell: bash
        run: |
          git status --porcelain -- vectors
          test -z "$(git status --porcelain -- vectors)"
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # The Wayland desktop against a headless sway: PipeWire, WirePlumber, xdg-desktop-portal and xdg-desktop-portal-wlr
  # on a private D-Bus session, started by tools/wayland_headless.sh. The portal has no RemoteDesktop, so this covers
  # the view; GNOME's portal (the dialog, input, the restore token) is not run anywhere in CI.
  gui-wayland:
    name: Wayland desktop (headless sway)
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install the compositor, the portals and PipeWire
        run: sudo apt-get update && sudo apt-get install -y sway xdg-desktop-portal xdg-desktop-portal-wlr pipewire wireplumber libpipewire-0.3-dev libclang-dev pkg-config dbus-user-session
      - run: cargo build -p bohio --features gui,gui-wayland
      - run: cargo clippy -p bohio --features gui,gui-wayland --all-targets -- -D warnings
      - name: The capture test
        run: tools/wayland_headless.sh cargo test -p bohio --features gui,gui-wayland --test gui_wayland -- --nocapture --test-threads=1

  # The copy of tools/build.py equals the release overlay's, the SDK lock agrees with the repository, and the
  # deps branch commit the lock pins covers Cargo.lock and passes the scanner.
  tools:
    name: Build tool checks
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          # The tool's floor, not the newest: Debian 12 ships 3.11.
          python-version: "3.11"
      - name: Fetch the pinned deps commit
        id: pin
        run: |
          sha=$(awk '$1=="deps" && $2=="crates" {print $3}' tools/sdk.lock)
          test -n "$sha"
          git fetch --depth 1 origin "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - run: python tools/build.py self check
      - run: python tools/build.py sdk check --online
      - run: python tools/build.py deps check --ref ${{ steps.pin.outputs.sha }}
      - run: python tools/build.py scan ${{ steps.pin.outputs.sha }}

  # A build from the deps branch with the network actually gone: a user and network namespace has no
  # interface but a down loopback, so a build that reached for the network fails instead of passing quietly.
  offline:
    name: Offline build
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: ./.github/actions/sdk
      - uses: dtolnay/rust-toolchain@stable
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Control, the network is cut
        # cargo fetch with the default cargo home needs crates.io and GitHub: it must fail, and for the network's sake.
        run: |
          if out=$(unshare --user --map-root-user --net -- cargo fetch --locked 2>&1); then
            echo "$out"
            echo "cargo fetch succeeded: the network was not cut"
            exit 1
          fi
          echo "$out" | tail -n 12
          echo "$out" | grep -Eqi "resolve host|network|unable to update|failed to get|could not connect"
      - name: Write the cargo config that replaces every source by the deps branch
        id: use
        run: |
          config=$(python tools/build.py deps use --out "$RUNNER_TEMP/offline" --json | python -c 'import json,sys; print(json.load(sys.stdin)["config"])')
          echo "config=$config" >> "$GITHUB_OUTPUT"
      - name: Build with the network cut
        run: |
          unshare --user --map-root-user --net -- cargo --config "${{ steps.use.outputs.config }}" build --release --locked -p bohio --features cli --bin bohio
          target/release/bohio --version
      - name: Control, the registry is unreachable from the same namespace
        run: |
          if unshare --user --map-root-user --net -- curl -sS --max-time 15 -o /dev/null https://index.crates.io/config.json; then
            echo "the network is reachable from the namespace"
            exit 1
          fi

  release-matrix:
    name: Release matrix
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      binaries: ${{ steps.matrix.outputs.binaries }}
      universal: ${{ steps.matrix.outputs.universal }}
      images: ${{ steps.matrix.outputs.images }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: matrix
        run: |
          # The macOS targets are built together on one runner and joined, so they are not legs of their own.
          echo "binaries=$(python tools/build.py release matrix --section binaries | jq -c '{include: [.include[] | select(.target | test("apple-darwin") | not)]}')" >> "$GITHUB_OUTPUT"
          echo "universal=$(python tools/build.py release matrix --section universal)" >> "$GITHUB_OUTPUT"
          echo "images=$(python tools/build.py release matrix --section images)" >> "$GITHUB_OUTPUT"

  release-build:
    name: Release ${{ matrix.target }}
    needs: release-matrix
    timeout-minutes: 60
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-matrix.outputs.binaries) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: musl-gcc compiles ring's C for the static Linux targets
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: ./.github/actions/sdk
        with:
          groups: core,release
      - run: python tools/build.py release build --target ${{ matrix.target }} --offline
      - name: Every Linux binary is static
        if: runner.os == 'Linux'
        run: python tools/build.py release verify --target ${{ matrix.target }}
      - name: What was built
        shell: bash
        run: |
          ls -l dist
          cat dist/SHA256SUMS
          mv dist/SHA256SUMS "dist/SHA256SUMS.${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release-universal:
    name: Release universal-apple-darwin
    needs: release-matrix
    timeout-minutes: 60
    runs-on: ${{ fromJSON(needs.release-matrix.outputs.universal).include[0].runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: ./.github/actions/sdk
        with:
          groups: core,release
      - name: Both Apple targets, then one binary for both
        run: |
          for target in ${{ fromJSON(needs.release-matrix.outputs.universal).include[0].targets }}; do
            python tools/build.py release build --target "$target" --offline
          done
          python tools/build.py release universal
          ls -l dist
          tar -xzf dist/bohio-*-universal-apple-darwin.tar.gz -C "$RUNNER_TEMP"
          lipo -info "$RUNNER_TEMP"/bohio-*-universal-apple-darwin/bohio
          mv dist/SHA256SUMS dist/SHA256SUMS.universal-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: dist-universal-apple-darwin
          path: dist/*
          if-no-files-found: error

  release-image:
    name: Release image ${{ matrix.arch }}
    needs: release-matrix
    timeout-minutes: 60
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-matrix.outputs.images) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/build.py release image --arch ${{ matrix.arch }}
      - name: What was built
        run: |
          ls -l dist
          mv dist/SHA256SUMS "dist/SHA256SUMS.image-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-image-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
