# coqui-transport-serial/. at 98b295f5580b9acbaefe43c1d0e3c83aff62afe1, with what it inherits written out.
[package]
name = "coqui-transport-serial"
version = "0.0.0-alpha.0"
description = "Serial ports as a coqui-transport stream, with a COBS and CRC-32C framing that detects damage on the line and carries on after it"
readme = "README.md"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/coqui-transport-serial"
homepage = "https://boriken-dev.github.io/coqui-transport-serial/"
keywords = ["serial", "uart", "rs-232", "rs-485", "transport"]
categories = ["hardware-support", "network-programming"]
exclude = [".*", "*.local.*", "/tools/"]
publish = false
[package.metadata]
[package.metadata.docs]
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
[features]
default = []
rs485 = ["serial2/rs4xx"]
[dependencies]
crc = "3.4"
[dependencies.coqui-builder]
git = "https://github.com/Boriken-Dev/coqui-builder"
rev = "c1875f8276bd6366c38e9133fdb1181a0ffbaaad"
features = ["derive"]
[dependencies.coqui-transport]
git = "https://github.com/Boriken-Dev/coqui-transport"
rev = "2601da58de9cac8f635060e4746864e9b238c6c5"
default-features = false
[dependencies.serial2]
version = "0.2.39"
features = ["unix", "windows"]
[dependencies.cobs]
version = "0.5.1"
default-features = false
features = ["alloc"]
[dev-dependencies]
toml = "1"
serde_json = "1"
[dev-dependencies.coqui-builder]
git = "https://github.com/Boriken-Dev/coqui-builder"
rev = "c1875f8276bd6366c38e9133fdb1181a0ffbaaad"
features = ["derive", "serde"]
[dev-dependencies.proptest]
version = "1"
default-features = false
features = ["std"]
[target]
[target."cfg(unix)"]
[target."cfg(unix)".dev-dependencies]
[target."cfg(unix)".dev-dependencies.rustix]
version = "1"
default-features = false
features = ["std", "pty", "fs", "termios"]
[lints]
[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unsafe_code = "forbid"
