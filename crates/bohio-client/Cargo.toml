[package]
name = "bohio-client"
description = "A Rust client for Bohío over any coqui channel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["bohio", "client", "remote-host"]
categories = ["network-programming"]
exclude = [".*", "*.local.*"]
# Its git dependencies are unpublished: released once they are.
publish = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Decode zstd (the C library). Without it a reader that gets zstd compressed data reports it as unsupported.
zstd = ["bohio-transfer/zstd"]
# The screen of a `bohio-gui/1` watch: the compositor that builds the frame from updates (PNG and JPEG rectangles come from `image`).
screen = ["bohio-transfer/screen"]

[dependencies]
bohio-transfer.workspace = true
tempfile.workspace = true
bohio-proto.workspace = true
coqui-transport.workspace = true
coqui-link.workspace = true
coqui-peer.workspace = true
coqui-transport-pipe.workspace = true
coqui-transport-web.workspace = true
coqui-peer-tls.workspace = true
rustls.workspace = true
x509-parser.workspace = true
coqui-transport-serial.workspace = true
url.workspace = true
socket2.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true

[lints]
workspace = true
