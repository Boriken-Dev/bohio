[package]
name = "bohio-test-plugin-echo"
description = "Test only: an echo console as a guatiao library, which a node can map or run in a process of its own"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
bohio-api = { workspace = true }

# Not the workspace's lints: the entry symbols `providers!` writes are `no_mangle`, which `unsafe_code = "forbid"` refuses.
[lints.rust]
missing_docs = "warn"
