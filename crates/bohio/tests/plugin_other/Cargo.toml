[package]
name = "bohio-test-plugin-other"
description = "Test only: a guatiao library that serves a kind of its own, which a Bohío node must not map"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
guatiao = { workspace = true }

# Not the workspace's lints: the entry symbols `providers!` writes are `no_mangle`, which `unsafe_code = "forbid"` refuses.
[lints.rust]
missing_docs = "warn"
