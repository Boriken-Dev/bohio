[package]
name = "bohio"
description = "Bohío: a remote host runtime serving filesystem, process and shell operations to proven peers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["remote", "host", "exec", "shell", "filesystem"]
categories = ["command-line-utilities", "network-programming"]
exclude = [".*", "*.local.*"]
# Its git dependencies are unpublished: released once they are.
publish = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bin]]
name = "bohio"
path = "src/main.rs"
required-features = ["cli"]
# The library crate documents itself under the same name: both would write target/doc/bohio.
doc = false

[features]
# What a host a person installs wants: the command, the two provider crates, zstd and the desktop encodings. An embedding
# program that takes the library alone sets `default-features = false`.
default = ["cli", "serial", "ssh", "zstd", "gui"]
# The node: the link, peers and grants, the engines, the configuration file, the provider registry and the client. Without it the
# library is the host's own sources, `access::Native` (processes, files, terminal and screen), and what they stand on: the build
# for a program that wants this machine's resources and not a node.
node = [
    "guatiao/load",
    "dep:guatiao-source-remote",
    "dep:bohio-client",
    "dep:bohio-transfer",
    "dep:coqui-transport",
    "dep:cabuya",
    "dep:coqui-peer",
    "dep:coqui-transport-pipe",
    "dep:coqui-transport-web",
    "dep:coqui-peer-tls",
    "dep:rustls",
    "dep:toml",
    "dep:toml_edit",
    "dep:anycfg",
    "dep:globset",
    "dep:regex",
    "dep:sysinfo",
    "dep:getrandom",
    "dep:x509-parser",
    "dep:serde_json",
    "dep:xxhash-rust",
]
# Zstandard through the C library, for the compression of reads, writes and exec streams (it compiles C with `cc`). Without it `zstd` is not offered, and `lz4` and `deflate` remain.
zstd = ["node", "bohio-transfer/zstd", "bohio-client/zstd"]
# zstd worker threads: `[compression] workers` above 0.
zstdmt = ["zstd", "bohio-transfer/zstdmt"]
# The serial console provider (`[source.NAME] provider = "serial"`): a terminal source over a serial line, registered with the built-in providers. In `default`, not in `cli`: a build without it can load the same provider as a library (`[providers] paths`).
serial = ["node", "dep:bohio-provider-serial"]
# The ssh provider (`[source.NAME] provider = "ssh"`): a machine reached over SSH as terminal and exec sources, registered with the built-in providers. In `default`, not in `cli`: a build without it can load the same provider as a library (`[providers] paths`).
ssh = ["node", "dep:bohio-provider-ssh"]
# The `bohio` command: arguments, output and the diagnostics subscriber. An embedding host takes the library alone.
cli = ["node", "dep:clap", "dep:tracing-subscriber", "dep:crossterm", "dep:ctrlc", "dep:windows-service", "notify"]
# Desktop access (`bohio-gui/1`): snapshot encoding (PNG, JPEG, lossless WebP), resizing, and the tiles and rectangle encodings of a watch. Without it a host has the engine and no image format, so a snapshot is `unsupported`.
gui = ["node", "dep:image", "dep:image-webp", "bohio-transfer/screen", "bohio-client/screen"]
# The Linux Wayland desktop (`platform/gui/wayland.rs`): xdg-desktop-portal ScreenCast and RemoteDesktop and a PipeWire stream. It links the system libpipewire-0.3 (pkg-config, and libclang for the bindings), so it is for glibc builds, and it does nothing off Linux.
gui-wayland = ["gui", "dep:ashpd", "dep:pipewire", "dep:pollster"]
# The desktop notification of the GUI's presence notice (`DesktopNotifier`); without it a node logs the notice.
notify = ["node", "dep:notify-rust"]

[dependencies]
bohio-api.workspace = true
bohio-x11 = { workspace = true, features = ["logind"] }
bohio-provider-serial = { workspace = true, optional = true }
bohio-provider-ssh = { workspace = true, optional = true }
# The registry that holds the node's providers: the kinds crate brings guatiao without it.
guatiao.workspace = true
guatiao-source-remote = { workspace = true, optional = true }
bohio-proto.workspace = true
bohio-client = { workspace = true, optional = true }
bohio-transfer = { workspace = true, optional = true }
coqui-transport = { workspace = true, optional = true }
cabuya = { workspace = true, optional = true }
coqui-peer = { workspace = true, optional = true }
coqui-transport-pipe = { workspace = true, optional = true }
coqui-transport-web = { workspace = true, optional = true }
coqui-peer-tls = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
serde.workspace = true
toml = { workspace = true, optional = true }
toml_edit = { workspace = true, optional = true }
anycfg = { workspace = true, optional = true }
portable-pty.workspace = true
cap-std.workspace = true
cap-fs-ext.workspace = true
thiserror.workspace = true
globset = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
# Host statistics for the `stats` control call.
sysinfo = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
x509-parser = { workspace = true, optional = true }
tracing.workspace = true
clap = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
crossterm = { workspace = true, optional = true }
ctrlc = { workspace = true, optional = true }
image = { workspace = true, optional = true }
image-webp = { workspace = true, optional = true }
notify-rust = { workspace = true, optional = true }
xxhash-rust = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
rustix.workspace = true
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
x11rb.workspace = true
xkeysym.workspace = true
zbus.workspace = true
ashpd = { workspace = true, optional = true }
pipewire = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
block2.workspace = true
objc2-foundation.workspace = true
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true
objc2-screen-capture-kit.workspace = true
enigo.workspace = true
arboard.workspace = true

[target.'cfg(windows)'.dependencies]
win32job.workspace = true
windows-sys.workspace = true
windows.workspace = true
windows-service = { workspace = true, optional = true }

[dev-dependencies]
tracing-subscriber.workspace = true
bohio-api = { workspace = true, features = ["testing"] }
ctrlc.workspace = true
tempfile.workspace = true
# The in-process SSH server `tests/ssh.rs` runs a source against (the provider's own test support).
russh.workspace = true
tokio = { workspace = true, features = ["process"] }
rand = { version = "0.10", default-features = false, features = ["std", "std_rng", "thread_rng"] }
bohio-provider-ssh.workspace = true
russh-sftp.workspace = true
rcgen.workspace = true
time.workspace = true
sha2.workspace = true
image = { workspace = true, features = ["webp"] }

# Built beside the test binary and never named in code: the libraries `tests/plugins.rs` loads. A static musl target cannot
# build a `cdylib`, so a test run for one takes the libraries built for glibc from `BOHIO_LIBRARY_DIR`.
[target.'cfg(not(target_env = "musl"))'.dev-dependencies]
bohio-provider-serial-plugin.workspace = true
bohio-provider-ssh-plugin.workspace = true
bohio-test-plugin-other = { path = "tests/plugin_other" }
bohio-test-plugin-echo = { path = "tests/plugin_echo" }
bohio-test-plugin-exec = { path = "tests/plugin_exec" }

[[test]]
name = "gui"
required-features = ["gui"]

[[test]]
name = "gui_presence"
required-features = ["gui"]

[[test]]
name = "gui_helper"
required-features = ["gui"]

[[test]]
name = "gui_stream"
required-features = ["gui"]

[[test]]
name = "cli"
required-features = ["cli"]

[[test]]
name = "embed"
required-features = ["cli"]

[[test]]
name = "link"
required-features = ["cli"]

[[test]]
name = "transports"
required-features = ["cli"]

[[test]]
name = "windows"
required-features = ["cli"]

[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[[test]]
name = "pairing"
required-features = ["cli"]


[[test]]
name = "tools_gui"
required-features = ["gui"]

[[test]]
name = "mcp"
required-features = ["cli"]

[[test]]
name = "console"
required-features = ["cli"]

[[test]]
name = "power_media"
required-features = ["cli"]

[[test]]
name = "plugins"
required-features = ["cli"]

[[test]]
name = "ssh"
required-features = ["cli", "ssh"]

[[test]]
name = "gui_helper_exec"
required-features = ["gui", "cli"]
