[package]
name = "bohio-bench"
description = "Bohío's benchmark harness: scenarios over a link, a raw TCP control, result files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
exclude = [".*", "*.local.*"]
publish = false

[features]
# Scenarios for features a later change adds; each is off until the feature exists.
hash = []
compress = []
delta = []
walk = []
pipeline = []

[dependencies]
bohio = { path = "../bohio", default-features = false }
bohio-client.workspace = true
bohio-proto.workspace = true
coqui-link.workspace = true
coqui-transport.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sysinfo.workspace = true

[lints]
workspace = true
