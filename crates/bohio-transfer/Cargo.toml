[package]
name = "bohio-transfer"
description = "Bohío's byte-level work, with no I/O of its own: digests of several algorithms in one pass, and compression piece by piece"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["bohio", "hash", "compression", "zstd", "lz4"]
categories = ["cryptography", "algorithms"]
exclude = [".*", "*.local.*"]
# Its sibling bohio-proto is unpublished: released once it is.
publish = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# zstd is the codec the protocol prefers; a build without it offers lz4 and deflate only.
default = ["zstd"]
# Zstandard through the C library (it compiles C with `cc`). Without it `zstd` is not offered and a request for it is unsupported; `lz4` and `deflate` stay.
zstd = ["dep:zstd"]
# zstd worker threads (`Caps::workers` above 0).
zstdmt = ["zstd", "zstd/zstdmt"]
# Screen updates (`screen`): tiles, rectangle encodings and the client's compositor. PNG and JPEG come from `image`.
screen = ["dep:image"]

[dependencies]
bohio-proto.workspace = true
sha2.workspace = true
sha1.workspace = true
md-5.workspace = true
blake3.workspace = true
xxhash-rust.workspace = true
crc32c.workspace = true
thiserror.workspace = true
zstd = { workspace = true, optional = true }
lz4_flex.workspace = true
flate2.workspace = true
image = { workspace = true, optional = true }

[dev-dependencies]
# Tests: the reference LZ4 frame encoder and decoder, to hold our frames to the standard.
lz4_flex = { workspace = true, features = ["frame"] }

[[test]]
name = "screen"
required-features = ["screen"]

[lints]
workspace = true
