# /etc/bohio/bohio.cfg for a node that serves its service account's own desktop (install.sh writes it when there is no
# file; an existing one needs these two tables added by hand). Edit [[listen]]; the file stays root-owned and not
# writable by the group or others. Approve peers with `bohio peer approve ID --allow info,gui.view,gui.input --config
# /etc/bohio/bohio.cfg`.

[service]
data_dir = "/var/lib/bohio"

[[listen]]
endpoint = "tcp://127.0.0.1:7620"

[gui]
enabled = true

[source.native]
# The account's own desktop, run by its user units (bohio-desktop.target): capture and XTest input on display :UID.
own_session = "x11"
