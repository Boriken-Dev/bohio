# The own desktop's compositor configuration (sway, headless backend), installed at ~/.config/bohio-desktop/sway.conf.
#
# One output, HEADLESS-1, and the X server fills it. The desktop's size is `resolution` below and `-geometry` in
# bohio-xwayland.service: change both to the same and restart bohio-compositor.service (Bohio reads what the display
# reports). For a high-density screen add `scale`. There is no lock screen, no idle timeout and no screen saver in
# this file, and none runs: the screen is always on and never locked.

# The X server of the own desktop is its own unit (bohio-xwayland.service), not sway's rootless one.
xwayland disable

output HEADLESS-1 resolution 1280x720
output * bg #1d2733 solid_color

default_border none
default_floating_border none
focus_follows_mouse yes

# Tells the X server's unit which Wayland socket sway chose (bohio-xwayland.service reads it).
exec_always /bin/sh -c 'printf "%s" "$WAYLAND_DISPLAY" > "$XDG_RUNTIME_DIR/bohio-wayland-display"'
