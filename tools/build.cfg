# The configuration of tools/build.py. `python3 tools/build.py help config` prints every key with its default.

[tools]
files = ["build.py"]

[deps]
# The orphan branch holds crates/ for Cargo.lock; main records the commit it was built with in the SDK lock.
branch = "deps"

[deps.pin]
lock = "tools/sdk.lock"
item = "deps crates"

[sdk]
lock = "tools/sdk.lock"
groups = ["core", "release", "deps"]
install = ["core"]

[sdk.system]
print = { linux = "sudo apt-get install -y build-essential musl-tools podman", macos = "xcode-select --install", windows = "Install Visual Studio Build Tools with the Windows SDK and the MSVC tools for the host architecture (ARM64 needs the ARM64 tools too)." }

# Cargo.toml's rust-version is the minimum toolchain the lock names.
[[sdk.agree]]
item = "core rust"
file = "Cargo.toml"
pattern = '^rust-version = "([^"]+)"'
match = "prefix"

# The container build: the base images, the toolchain and rustup-init in packaging/container/Containerfile are held to the
# lock. `container build|test` reads the rows named here for the defaults it reports; tools/build.py help env lists the
# overrides of .env.
[container]
base_item = "release rust-image"
runtime_item = "release debian-image"

[[sdk.agree]]
item = "release rust-image"
file = "packaging/container/Containerfile"
pattern = '^ARG BASE_IMAGE=docker\.io/library/rust:([^@\s]+)@sha256:[0-9a-f]{64}$'

[[sdk.agree]]
item = "release rust-image"
file = "packaging/container/Containerfile"
pattern = '^ARG BASE_IMAGE=docker\.io/library/rust:[^@\s]+@sha256:([0-9a-f]{64})$'
expect = "{sha256}"

[[sdk.agree]]
item = "release debian-image"
file = "packaging/container/Containerfile"
pattern = '^ARG RUNTIME_IMAGE=docker\.io/library/debian:([^@\s]+)@sha256:[0-9a-f]{64}$'

[[sdk.agree]]
item = "release debian-image"
file = "packaging/container/Containerfile"
pattern = '^ARG RUNTIME_IMAGE=docker\.io/library/debian:[^@\s]+@sha256:([0-9a-f]{64})$'
expect = "{sha256}"

[[sdk.agree]]
item = "core rust"
file = "packaging/container/Containerfile"
pattern = '^ARG RUST_VERSION=(\S+)$'
first = true

[[sdk.agree]]
item = "core rustup-init"
file = "packaging/container/Containerfile"
pattern = '^ARG RUSTUP_VERSION=(\S+)$'
first = true

[[sdk.agree]]
item = "core rustup-init"
file = "packaging/container/Containerfile"
pattern = '^ARG RUSTUP_INIT_SHA256_X86_64=([0-9a-f]{64})$'
platform = "linux-x64"
expect = "{sha256}"

[[sdk.agree]]
item = "core rustup-init"
file = "packaging/container/Containerfile"
pattern = '^ARG RUSTUP_INIT_SHA256_AARCH64=([0-9a-f]{64})$'
platform = "linux-arm64"
expect = "{sha256}"

[release]
name = "bohio"
version_from = "Cargo.toml"
toolchain = "1.100.0"

[[release.packages]]
package = "bohio"
bin = "bohio"
features = ["cli"]

# Linux is static (musl), so one archive runs on any distribution; ring's C is compiled by musl-gcc.
[[release.target]]
triple = "x86_64-unknown-linux-musl"
runner = "ubuntu-latest"
env = { "CC_{triple_}" = "musl-gcc" }

[[release.target]]
triple = "aarch64-unknown-linux-musl"
runner = "ubuntu-24.04-arm"
env = { "CC_{triple_}" = "musl-gcc" }

[[release.target]]
triple = "x86_64-pc-windows-msvc"
runner = "windows-latest"
rustflags = ["-C", "target-feature=+crt-static"]
archive = "zip"

[[release.target]]
triple = "aarch64-pc-windows-msvc"
runner = "windows-11-arm"
rustflags = ["-C", "target-feature=+crt-static"]
archive = "zip"

[[release.target]]
triple = "aarch64-apple-darwin"
runner = "macos-latest"

[[release.target]]
triple = "x86_64-apple-darwin"
runner = "macos-latest"

[release.universal]
macos = ["aarch64-apple-darwin", "x86_64-apple-darwin"]

[release.image]
file = "packaging/container/Containerfile"
context = "."
name = "bohio"
from_deps = true
archs = { amd64 = "ubuntu-latest", arm64 = "ubuntu-24.04-arm" }
