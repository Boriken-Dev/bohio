# bohio.cfg: every key is optional; the value shown is the default unless a comment says otherwise.
# A key this version does not know is an error naming it.
#
# Without --config, the first file that exists is used:
#   $BOHIO_CONFIG
#   %APPDATA%\bohio\bohio.cfg                 or   $XDG_CONFIG_HOME/bohio/bohio.cfg (else ~/.config/bohio/bohio.cfg)
#   %ProgramData%\bohio\bohio.cfg             or   /etc/bohio/bohio.cfg
# With none, every default applies.

[service]
# A name shown in `info` and logs.
name = "bohio"
# The directory holding the identity, the trust store and peers.cfg. Default: "bohio" under
# %LOCALAPPDATA% or $XDG_DATA_HOME (else ~/.local/share).
# data_dir = "/var/lib/bohio"

# Where the host accepts links: `scheme://address`. Zero or more entries; the default is none.
[[listen]]
endpoint = "tcp://127.0.0.1:7620"

[link]
# How often a running stream's permission is decided again, so a revoked peer's streams end.
# A number of seconds or text with a unit: 500ms, 5s, 2m, 1h.
recheck = "5s"
# The most streams one peer may have open at once. At least 1.
max_streams = 64
# The most links open at once across peers, counting those still proving themselves; one past it
# is closed unread. At least 1.
max_connections = 128
# How long a peer has to prove itself. Not zero.
proof_timeout = "10s"
# Memory per link is bounded by these, never by the size of a file or an output: a stream's sender
# may be at most `window` bytes ahead of its reader, each direction between the link and an engine
# holds at most `queue_bytes`, the socket's reader holds `read_ahead` messages of `max_frame` bytes
# and its writer `queued_bytes`.
# Bytes a peer may send on one stream ahead of what has been read from it. At least 1.
window = 1048576
# The most bytes of one message in one frame (a longer message is sent in parts). At least 1.
max_frame = 65536
# The largest message on a stream: more than the largest chunk_size. At least 1.
max_message = 1048576
# Bytes a stream holds in each direction between the link and its engine. At least 1.
queue_bytes = 262144
# Messages the socket's reader holds ahead of the link once a peer is proven (one before). At least 1.
read_ahead = 8
# Bytes the socket's writer may have queued. At least 1.
queued_bytes = 1048576
# How long a frame the socket takes nothing of ends the link, and how long a finished stream's queue
# is given to drain. Not zero.
send_limit = "10s"
# How long a send waits for credit before it reports no progress and is tried again. Not zero.
send_wait = "250ms"
# How often a stream's threads look at whether it was closed. Not zero.
poll_interval = "50ms"

[filesystem]
# Whether filesystem calls are served. A peer still needs fs.read or fs.write and a root in peers.cfg.
enabled = true
# The most file transfers (reads and writes) running at once, across peers. At least 1.
max_transfers = 16
# The most file bytes in one frame, and the buffer a copy or checksum reads with. At least 1;
# a smaller message bound of the stream wins.
chunk_size = 65536
# The most entries in one page of a directory listing, whatever the client asks for. At least 1.
list_page = 1000
# How long a transfer may make no progress before the host abandons it. Not zero.
idle_timeout = "5m"
# How often a transfer looks at its stream while it waits. Not zero.
poll_interval = "20ms"
# Whether a write is flushed to storage before it is put in place.
sync_writes = true

[execution]
# Whether processes are run. A peer still needs exec in peers.cfg.
enabled = true
# The most processes running at once, across peers. At least 1.
max_processes = 16
# The most output bytes in one frame. At least 1; a smaller message bound of the stream wins.
chunk_size = 16384
# How often a running process, its deadline and its stream are looked at. Not zero.
poll_interval = "20ms"
# How long after a process exits its remaining output is awaited before the rest of its tree is ended.
drain_timeout = "500ms"

[shell]
# Whether interactive shell sessions are opened. A peer still needs shell in peers.cfg.
enabled = true
# The most sessions open at once, across peers. At least 1.
max_sessions = 8
# The most terminal bytes in one frame. At least 1; a smaller message bound of the stream wins.
chunk_size = 16384
# How often a session looks at its program and its stream while it waits. Not zero.
poll_interval = "20ms"
# How long the terminal must stay quiet after the program has exited before the session ends: the
# terminal can deliver the last of the output after the exit.
drain_quiet = "200ms"
# How long the host waits for a session's output reader to finish after the program's tree has
# been ended, before it reports the exit regardless.
kill_wait = "2s"
