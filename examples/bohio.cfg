# bohio.cfg: every key is optional; the value shown is the default unless a comment says otherwise.
# A key this version does not know is an error naming it.
#
# Without --config, the first file that exists is used:
#   $BOHIO_CONFIG
#   %APPDATA%\bohio\bohio.cfg                 or   $XDG_CONFIG_HOME/bohio/bohio.cfg (else ~/.config/bohio/bohio.cfg)
#   %ProgramData%\bohio\bohio.cfg             or   /etc/bohio/bohio.cfg
# With none, every default applies.

[service]
# A name shown in `info` and logs.
name = "bohio"
# The directory holding the identity, the trust store and peers.cfg. Default: "bohio" under
# %LOCALAPPDATA% or $XDG_DATA_HOME (else ~/.local/share).
# data_dir = "/var/lib/bohio"

# Where the host accepts links: `scheme://address`. Zero or more entries; the default is none.
[[listen]]
endpoint = "tcp://127.0.0.1:7620"

[link]
# How often a running stream's permission is decided again, so a revoked peer's streams end.
# A number of seconds or text with a unit: 500ms, 5s, 2m, 1h.
recheck = "5s"
# The most streams one peer may have open at once. At least 1.
max_streams = 64

[filesystem]
# Whether filesystem calls are served. A peer still needs fs.read or fs.write and a root in peers.cfg.
enabled = true

[execution]
# Whether processes are run. A peer still needs exec in peers.cfg.
enabled = true
# The most processes running at once, across peers. At least 1.
max_processes = 16
# The most output bytes in one frame. At least 1; a smaller message bound of the stream wins.
chunk_size = 16384
# How often a running process, its deadline and its stream are looked at. Not zero.
poll_interval = "20ms"
# How long after a process exits its remaining output is awaited before the rest of its tree is ended.
drain_timeout = "500ms"

[shell]
# Whether interactive shell sessions are opened. A peer still needs shell in peers.cfg.
enabled = true
# The most sessions open at once, across peers. At least 1.
max_sessions = 8
