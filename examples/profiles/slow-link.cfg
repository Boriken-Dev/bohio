# A node on a slow or distant path (a satellite, a mobile network, a site-to-site VPN): spend CPU to send fewer
# bytes. The profile sets (see docs/profiles.md):
#   [compression] default = zstd level 19, window_log_max = 27 (a decoder holds 128 MiB for a stream), prepare_max_bytes = 4 GiB
#   [link] bulk_window = 4 MiB, max_window = 16 MiB, auto_window = true, max_opens_per_minute = 6000
#   [filesystem] resume_ttl = 1h
# A key below wins over the profile.
[profile]
name = "slow-link"

# What `bohio remote` asks for on such a path: zstd level 19 with a 128 MiB window, a compressed read of a file over
# 16 MiB prepared in full first, delta, comparison by blake3, four streams for a file.
[client]
profile = "slow-link"
