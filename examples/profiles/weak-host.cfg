# A host that cannot compress or hash much (a small board, a shared machine): the cheap compressor, low caps, one hash
# and one walk at a time. The profile sets (see docs/profiles.md):
#   [compression] allowed = ["lz4", "zstd"], default = lz4, max_level = 3, window_log_max = 20, workers = 0
#   [hash] max_streams = 1;  [walk] max_streams = 1;  [filesystem] max_transfers = 4
#   [link] max_window = 1 MiB, auto_window = false;  [delta] max_signature_bytes = 8 MiB
# A key below wins over the profile.
[profile]
name = "weak-host"

# What `bohio remote` asks for from a weak machine: lz4, an xxh128 digest to compare, one stream.
[client]
profile = "weak-host"
