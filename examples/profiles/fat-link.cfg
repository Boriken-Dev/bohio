# A node on a long path with room in it (a round trip of a few hundred milliseconds, tens of megabits or more): one
# bulk stream moves at most its receive window per round trip, so the window is raised. The profile sets (see
# docs/profiles.md):
#   [link] bulk_window = 8 MiB
# The value comes from a path of 267 ms and 200 Mbit/s; a path with a larger bandwidth-delay product wants a larger
# window, and the other end needs the same setting for what it receives. A key below wins over the profile.
[profile]
name = "fat-link"

# What `bohio remote` asks for on such a path: a bulk read with an 8 MiB window, nothing compressed.
[client]
profile = "fat-link"
