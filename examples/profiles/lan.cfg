# A node on a local network: a round trip of a millisecond or two, so the window rather than the path limits one
# transfer, and compression only costs CPU. The profile sets (see docs/profiles.md):
#   [filesystem] chunk_size = 256 KiB
#   [link] bulk_window = 4 MiB, max_window = 8 MiB
# Every key below it wins over the profile; the file needs nothing else.
[profile]
name = "lan"

# What `bohio remote` asks for on this network: no compression, two streams for a file, a 4 MiB window for a bulk stream.
[client]
profile = "lan"
