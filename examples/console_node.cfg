# An agentless node: a small computer on a serial cable to the system's console (a KVM, a terminal server or the
# machine's serial port), serving that console and nothing else. Nothing runs on the system itself.
#
# From anywhere a peer is allowed:
#   bohio remote tcp://NODE:7620 --server ID console          # Ctrl-] then q leaves it
#   bohio remote tcp://NODE:7620 --server ID attach console:console --from 0   # what it showed meanwhile

[[listen]]
endpoint = "tcp://0.0.0.0:7620"

[source.console]
provider = "serial"
path = "/dev/ttyUSB0"
baud_rate = 115200
# The line is opened again this long after it vanishes (an unplugged adapter), so the console outlives the cable.
reopen_after = "1s"

[access]
terminal = ["console"]
desktop = []
# This node has no files or programs to offer: the console is all there is.
fs = "none"
exec = "none"

[sessions]
# How much of the console's output is kept for a peer that attaches later.
scrollback = 4194304
max_scrollback = 16777216

# A peer is granted the console with `shell` (and `session` to read it again with `attach`); its key is added with
# `bohio peer approve ID --allow info,shell,session`.
